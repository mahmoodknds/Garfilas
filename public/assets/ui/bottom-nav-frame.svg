<svg width="1024" height="220" viewBox="0 0 1024 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass" x1="512" y1="24" x2="512" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#120C08" stop-opacity="0.34"/>
      <stop offset="0.38" stop-color="#0B0806" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#030302" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="edge" x1="68" y1="18" x2="954" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A"/>
      <stop offset="0.18" stop-color="#FFB43D"/>
      <stop offset="0.48" stop-color="#FF6F08"/>
      <stop offset="0.72" stop-color="#FF9D24"/>
      <stop offset="1" stop-color="#FFD36A"/>
    </linearGradient>
    <linearGradient id="highlight" x1="512" y1="14" x2="512" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0B0" stop-opacity="0.34"/>
      <stop offset="0.22" stop-color="#FFB04A" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#FF7A12" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FF7A12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomLight" x1="160" y1="202" x2="864" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6F08" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#FF8A18" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#FFD06A" stop-opacity="0.96"/>
      <stop offset="0.8" stop-color="#FF8A18" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FF6F08" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-35%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 1 0 0 0.35  0 0 1 0 0.02  0 0 0 0.58 0" result="orangeGlow"/>
      <feMerge>
        <feMergeNode in="orangeGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glassBlur" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <!-- Soft ambient neon behind the glass -->
  <path
    d="M42 42 C42 21 58 9 82 9 H390 C421 9 438 8 455 0 C473 -8 488 -14 512 -14 C536 -14 551 -8 569 0 C586 8 603 9 634 9 H942 C966 9 982 21 982 42 V178 C982 196 970 208 950 208 H74 C54 208 42 196 42 178 Z"
    stroke="#FF7A12"
    stroke-opacity="0.46"
    stroke-width="10"
    filter="url(#softGlow)"
  />

  <!-- Glass body. The center shoulder is part of the actual geometry, not a pseudo-element. -->
  <path
    d="M2 55 C2 30 21 10 47 10 H391 C421 10 437 9 453 2 C471 -6 486 -12 512 -12 C538 -12 553 -6 571 2 C587 9 603 10 633 10 H977 C1003 10 1022 30 1022 55 V181 C1022 204 1006 218 983 218 H41 C18 218 2 204 2 181 Z"
    fill="url(#glass)"
    stroke="url(#edge)"
    stroke-width="2.5"
    filter="url(#neon)"
  />

  <!-- Transparent glass highlight just inside the upper edge. -->
  <path
    d="M6 55 C6 32 23 14 48 14 H392 C422 14 439 13 456 6 C474 -1 488 -7 512 -7 C536 -7 550 -1 568 6 C585 13 602 14 632 14 H976 C1001 14 1018 32 1018 55"
    stroke="url(#highlight)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
    filter="url(#glassBlur)"
  />

  <!-- Fine inner glass rim, matching the reference's double-line construction. -->
  <path
    d="M7 57 C7 36 23 18 49 18 H393 C423 18 441 17 458 10 C476 3 489 0 512 0 C535 0 548 3 566 10 C583 17 601 18 631 18 H975 C1001 18 1017 36 1017 57 V180 C1017 198 1004 211 984 211 H40 C20 211 7 198 7 180 Z"
    stroke="#FFB04A"
    stroke-opacity="0.15"
    stroke-width="1"
    fill="none"
  />

  <!-- Subtle glass reflection across the top third. -->
  <path
    d="M54 35 H390 C423 35 441 32 459 25 C477 18 490 14 512 14 C534 14 547 18 565 25 C583 32 601 35 634 35 H970"
    stroke="#FFF2C2"
    stroke-opacity="0.055"
    stroke-width="9"
    stroke-linecap="round"
    filter="url(#softGlow)"
  />

  <!-- Bright lower glass edge. -->
  <path
    d="M42 204 H982"
    stroke="url(#bottomLight)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Tiny center reflection under the active cart button. -->
  <circle cx="512" cy="207" r="2.2" fill="#FFD36A" filter="url(#neon)"/>
</svg>
